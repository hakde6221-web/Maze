name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG - list files in working dir
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== ls -la ==="
          ls -la
          echo "=== find . -name 'main*' ==="
          find . -name 'main*' -not -path './.git/*'
          echo "=== file main.py ==="
          file main.py || echo "main.py НЕ НАЙДЕН"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip wheel
          pip install buildozer cython==0.29.34

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p ~/.android/licenses
          touch ~/.android/repositories.cfg
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n601085b94cd77f0b54ff86406957099ebe79c4d6\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > ~/.android/licenses/android-sdk-license

      - name: Build APK
        run: |
          buildozer -v android debug > buildozer.log 2>&1 || true

      - name: Show last 200 lines
        if: always()
        run: tail -n 200 buildozer.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package
          path: bin/*.apk
