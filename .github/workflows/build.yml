name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip wheel
          pip install buildozer cython==0.29.34

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p ~/.android/licenses
          touch ~/.android/repositories.cfg
          cat > ~/.android/licenses/android-sdk-license << 'EOF'
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          84831b9409646a918e30573bab4c9c91346d8abd
          601085b94cd77f0b54ff86406957099ebe79c4d6
          d56f5187479451eabf01fb78af6dfcb131a6481e
          EOF
          mkdir -p ~/.android/licenses
          cat > ~/.android/licenses/android-sdk-preview-license << 'EOF'
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package
          path: bin/*.apk
